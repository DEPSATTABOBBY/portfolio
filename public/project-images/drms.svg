<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6ee7b7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="white" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="500"/><line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="500"/><line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/><line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/><line x1="720" y1="0" x2="720" y2="500"/>
    <line x1="0" y1="0" x2="800" y2="0"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>
  <!-- Recycling symbol -->
  <g transform="translate(400,220)" opacity="0.15">
    <path d="M0,-100 L50,-10 L-50,-10 Z" fill="none" stroke="white" stroke-width="8"/>
    <path d="M86,50 L36,140 L136,140 Z" fill="none" stroke="white" stroke-width="8"/>
    <path d="M-86,50 L-136,140 L-36,140 Z" fill="none" stroke="white" stroke-width="8"/>
  </g>
  <!-- Dashboard mockup -->
  <rect x="150" y="100" width="500" height="300" rx="12" fill="#0a0a0a" opacity="0.7"/>
  <rect x="150" y="100" width="500" height="40" rx="12" fill="#111827"/>
  <circle cx="175" cy="120" r="6" fill="#ef4444"/>
  <circle cx="195" cy="120" r="6" fill="#eab308"/>
  <circle cx="215" cy="120" r="6" fill="#22c55e"/>
  <text x="400" y="125" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">DRMS Dashboard</text>
  <!-- Sidebar -->
  <rect x="150" y="140" width="120" height="260" fill="#111827"/>
  <rect x="160" y="155" width="100" height="8" rx="4" fill="#059669" opacity="0.8"/>
  <rect x="160" y="175" width="80" height="6" rx="3" fill="#374151"/>
  <rect x="160" y="195" width="90" height="6" rx="3" fill="#374151"/>
  <rect x="160" y="215" width="70" height="6" rx="3" fill="#374151"/>
  <rect x="160" y="235" width="85" height="6" rx="3" fill="#374151"/>
  <!-- Main content cards -->
  <rect x="285" y="155" width="100" height="60" rx="8" fill="#065f46" opacity="0.5"/>
  <text x="335" y="180" font-family="sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">Waste</text>
  <text x="335" y="195" font-family="sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">1,247</text>
  <rect x="400" y="155" width="100" height="60" rx="8" fill="#065f46" opacity="0.5"/>
  <text x="450" y="180" font-family="sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">Drivers</text>
  <text x="450" y="195" font-family="sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">89</text>
  <rect x="515" y="155" width="100" height="60" rx="8" fill="#065f46" opacity="0.5"/>
  <text x="565" y="180" font-family="sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">Routes</text>
  <text x="565" y="195" font-family="sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">34</text>
  <!-- Chart bars -->
  <rect x="285" y="240" width="330" height="150" rx="8" fill="#0f172a" opacity="0.5"/>
  <rect x="300" y="340" width="30" height="30" rx="4" fill="#059669"/>
  <rect x="340" y="310" width="30" height="60" rx="4" fill="#059669" opacity="0.8"/>
  <rect x="380" y="280" width="30" height="90" rx="4" fill="#059669"/>
  <rect x="420" y="300" width="30" height="70" rx="4" fill="#059669" opacity="0.8"/>
  <rect x="460" y="260" width="30" height="110" rx="4" fill="#059669"/>
  <rect x="500" y="290" width="30" height="80" rx="4" fill="#059669" opacity="0.8"/>
  <rect x="540" y="320" width="30" height="50" rx="4" fill="#059669"/>
  <rect x="580" y="270" width="30" height="100" rx="4" fill="#34d399"/>
  <!-- Title -->
  <text x="400" y="460" font-family="sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">DRMS</text>
  <text x="400" y="485" font-family="sans-serif" font-size="14" fill="#6ee7b7" text-anchor="middle">Digital Request Waste Management System</text>
</svg>
