<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#581c87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity="0.05" stroke="white" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="500"/><line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="500"/><line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/><line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/><line x1="720" y1="0" x2="720" y2="500"/>
  </g>
  <!-- Brain/AI icon -->
  <g transform="translate(400,180)" opacity="0.12">
    <circle cx="0" cy="0" r="60" fill="none" stroke="white" stroke-width="3"/>
    <path d="M-30,-20 Q-10,-40 10,-20 Q30,0 10,20 Q-10,40 -30,20 Q-50,0 -30,-20" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="-15" cy="-5" r="8" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="15" cy="-5" r="8" fill="none" stroke="white" stroke-width="2"/>
  </g>
  <!-- Dashboard -->
  <rect x="150" y="100" width="500" height="300" rx="12" fill="#0a0a0a" opacity="0.7"/>
  <rect x="150" y="100" width="500" height="40" rx="12" fill="#1e1b4b"/>
  <circle cx="175" cy="120" r="6" fill="#ef4444"/>
  <circle cx="195" cy="120" r="6" fill="#eab308"/>
  <circle cx="215" cy="120" r="6" fill="#22c55e"/>
  <text x="400" y="125" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Sentiment Tracking System</text>
  <!-- Sentiment cards -->
  <rect x="170" y="155" width="100" height="80" rx="8" fill="#065f46" opacity="0.5"/>
  <text x="220" y="180" font-family="sans-serif" font-size="20" fill="#22c55e" text-anchor="middle">😊</text>
  <text x="220" y="200" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">72%</text>
  <text x="220" y="220" font-family="sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">Positive</text>
  <rect x="285" y="155" width="100" height="80" rx="8" fill="#713f12" opacity="0.5"/>
  <text x="335" y="180" font-family="sans-serif" font-size="20" fill="#eab308" text-anchor="middle">😐</text>
  <text x="335" y="200" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">18%</text>
  <text x="335" y="220" font-family="sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle">Neutral</text>
  <rect x="400" y="155" width="100" height="80" rx="8" fill="#7f1d1d" opacity="0.5"/>
  <text x="450" y="180" font-family="sans-serif" font-size="20" fill="#ef4444" text-anchor="middle">😞</text>
  <text x="450" y="200" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">10%</text>
  <text x="450" y="220" font-family="sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">Negative</text>
  <!-- Pie chart -->
  <circle cx="560" cy="195" r="50" fill="none" stroke="#22c55e" stroke-width="15" stroke-dasharray="226 314" stroke-dashoffset="0" opacity="0.7"/>
  <circle cx="560" cy="195" r="50" fill="none" stroke="#eab308" stroke-width="15" stroke-dasharray="57 314" stroke-dashoffset="-226" opacity="0.7"/>
  <circle cx="560" cy="195" r="50" fill="none" stroke="#ef4444" stroke-width="15" stroke-dasharray="31 314" stroke-dashoffset="-283" opacity="0.7"/>
  <!-- Sentiment analysis list -->
  <rect x="170" y="250" width="460" height="130" rx="8" fill="#0f172a" opacity="0.5"/>
  <text x="190" y="275" font-family="sans-serif" font-size="11" fill="#a855f7" font-weight="bold">Recent Feedback Analysis</text>
  <line x1="180" y1="285" x2="620" y2="285" stroke="#374151" stroke-width="1"/>
  <rect x="190" y="295" width="8" height="8" rx="4" fill="#22c55e"/>
  <text x="210" y="303" font-family="sans-serif" font-size="10" fill="#d1d5db">"Great product, love the features!"</text>
  <text x="590" y="303" font-family="sans-serif" font-size="9" fill="#22c55e">Positive</text>
  <rect x="190" y="315" width="8" height="8" rx="4" fill="#eab308"/>
  <text x="210" y="323" font-family="sans-serif" font-size="10" fill="#d1d5db">"It works okay, nothing special"</text>
  <text x="590" y="323" font-family="sans-serif" font-size="9" fill="#eab308">Neutral</text>
  <rect x="190" y="335" width="8" height="8" rx="4" fill="#22c55e"/>
  <text x="210" y="343" font-family="sans-serif" font-size="10" fill="#d1d5db">"Excellent customer service response"</text>
  <text x="590" y="343" font-family="sans-serif" font-size="9" fill="#22c55e">Positive</text>
  <rect x="190" y="355" width="8" height="8" rx="4" fill="#ef4444"/>
  <text x="210" y="363" font-family="sans-serif" font-size="10" fill="#d1d5db">"App keeps crashing on my phone"</text>
  <text x="590" y="363" font-family="sans-serif" font-size="9" fill="#ef4444">Negative</text>
  <!-- Title -->
  <text x="400" y="455" font-family="sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">Sentiment Tracking System</text>
  <text x="400" y="480" font-family="sans-serif" font-size="14" fill="#c084fc" text-anchor="middle">AI-Powered Sentiment Analysis Platform</text>
</svg>
