<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity="0.05" stroke="white" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="500"/><line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="500"/><line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/><line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/><line x1="720" y1="0" x2="720" y2="500"/>
  </g>
  <!-- Shield icon -->
  <g transform="translate(400,180)" opacity="0.12">
    <path d="M0,-80 L70,-50 L70,20 Q70,70 0,100 Q-70,70 -70,20 L-70,-50 Z" fill="none" stroke="white" stroke-width="4"/>
    <path d="M0,-50 L45,-30 L45,15 Q45,50 0,65 Q-45,50 -45,15 L-45,-30 Z" fill="none" stroke="white" stroke-width="2"/>
    <text x="0" y="20" font-family="sans-serif" font-size="40" fill="white" text-anchor="middle" font-weight="bold">VPN</text>
  </g>
  <!-- Terminal mockup -->
  <rect x="150" y="100" width="500" height="300" rx="12" fill="#0a0a0a" opacity="0.7"/>
  <rect x="150" y="100" width="500" height="40" rx="12" fill="#0c2d48"/>
  <circle cx="175" cy="120" r="6" fill="#ef4444"/>
  <circle cx="195" cy="120" r="6" fill="#eab308"/>
  <circle cx="215" cy="120" r="6" fill="#22c55e"/>
  <text x="400" y="125" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">OpenVPN Configuration Terminal</text>
  <!-- Terminal content -->
  <rect x="165" y="150" width="470" height="235" rx="6" fill="#0f172a"/>
  <text x="180" y="175" font-family="monospace" font-size="11" fill="#22c55e">$</text>
  <text x="195" y="175" font-family="monospace" font-size="11" fill="#e2e8f0">sudo openvpn --config server.conf</text>
  <text x="180" y="195" font-family="monospace" font-size="10" fill="#6ee7b7">2024-01-15 10:23:45 OpenVPN 2.6.8 x86_64</text>
  <text x="180" y="210" font-family="monospace" font-size="10" fill="#6ee7b7">2024-01-15 10:23:45 TLS Auth key loaded</text>
  <text x="180" y="225" font-family="monospace" font-size="10" fill="#6ee7b7">2024-01-15 10:23:45 SSL connection established</text>
  <text x="180" y="240" font-family="monospace" font-size="10" fill="#22c55e">2024-01-15 10:23:46 Peer Connection Initiated</text>
  <text x="180" y="255" font-family="monospace" font-size="10" fill="#22c55e">2024-01-15 10:23:47 Initialization Sequence Complete</text>
  <text x="180" y="275" font-family="monospace" font-size="10" fill="#6ee7b7">Tunnel IP: 10.8.0.2/24</text>
  <text x="180" y="290" font-family="monospace" font-size="10" fill="#6ee7b7">VPN Server: vpn.ianserver.com</text>
  <text x="180" y="305" font-family="monospace" font-size="10" fill="#6ee7b7">Protocol: UDP | Port: 1194</text>
  <text x="180" y="325" font-family="monospace" font-size="10" fill="#22c55e">Status: </text>
  <text x="260" y="325" font-family="monospace" font-size="10" fill="#22c55e" font-weight="bold">CONNECTED</text>
  <rect x="370" y="315" width="60" height="16" rx="8" fill="#065f46" opacity="0.8"/>
  <text x="400" y="327" font-family="monospace" font-size="9" fill="#22c55e" text-anchor="middle">SECURE</text>
  <text x="180" y="350" font-family="monospace" font-size="10" fill="#6ee7b7">Encryption: AES-256-GCM</text>
  <text x="180" y="365" font-family="monospace" font-size="10" fill="#6ee7b7">Auth: SHA-512 | TLS: tls-crypt</text>
  <text x="180" y="380" font-family="monospace" font-size="10" fill="#22c55e">$</text>
  <text x="190" y="380" font-family="monospace" font-size="11" fill="white" opacity="0.5">_</text>
  <!-- Title -->
  <text x="400" y="455" font-family="sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">OpenVPN Configuration</text>
  <text x="400" y="480" font-family="sans-serif" font-size="14" fill="#7dd3fc" text-anchor="middle">Secure VPN Network Setup</text>
</svg>
