<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity="0.05" stroke="white" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="500"/><line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="500"/><line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/><line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/><line x1="720" y1="0" x2="720" y2="500"/>
  </g>
  <!-- Basketball -->
  <circle cx="400" cy="200" r="80" fill="none" stroke="white" stroke-width="3" opacity="0.15"/>
  <path d="M320,200 Q400,160 480,200" fill="none" stroke="white" stroke-width="2" opacity="0.15"/>
  <path d="M320,200 Q400,240 480,200" fill="none" stroke="white" stroke-width="2" opacity="0.15"/>
  <line x1="400" y1="120" x2="400" y2="280" stroke="white" stroke-width="2" opacity="0.15"/>
  <!-- Dashboard mockup -->
  <rect x="150" y="100" width="500" height="300" rx="12" fill="#0a0a0a" opacity="0.7"/>
  <rect x="150" y="100" width="500" height="40" rx="12" fill="#1c1917"/>
  <circle cx="175" cy="120" r="6" fill="#ef4444"/>
  <circle cx="195" cy="120" r="6" fill="#eab308"/>
  <circle cx="215" cy="120" r="6" fill="#22c55e"/>
  <text x="400" y="125" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">NBA Prediction System</text>
  <!-- Stats cards -->
  <rect x="170" y="155" width="140" height="70" rx="8" fill="#7c2d12" opacity="0.5"/>
  <text x="240" y="178" font-family="sans-serif" font-size="10" fill="#fb923c" text-anchor="middle">Accuracy</text>
  <text x="240" y="200" font-family="sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">62.4%</text>
  <rect x="330" y="155" width="140" height="70" rx="8" fill="#7c2d12" opacity="0.5"/>
  <text x="400" y="178" font-family="sans-serif" font-size="10" fill="#fb923c" text-anchor="middle">Games Predicted</text>
  <text x="400" y="200" font-family="sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">1,847</text>
  <rect x="490" y="155" width="140" height="70" rx="8" fill="#7c2d12" opacity="0.5"/>
  <text x="560" y="178" font-family="sans-serif" font-size="10" fill="#fb923c" text-anchor="middle">Win Rate</text>
  <text x="560" y="200" font-family="sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">58.1%</text>
  <!-- Game predictions table -->
  <rect x="170" y="240" width="460" height="140" rx="8" fill="#0f172a" opacity="0.5"/>
  <text x="190" y="265" font-family="sans-serif" font-size="11" fill="#fb923c" font-weight="bold">Team</text>
  <text x="350" y="265" font-family="sans-serif" font-size="11" fill="#fb923c" font-weight="bold">Win Prob</text>
  <text x="470" y="265" font-family="sans-serif" font-size="11" fill="#fb923c" font-weight="bold">Prediction</text>
  <line x1="180" y1="275" x2="620" y2="275" stroke="#374151" stroke-width="1"/>
  <text x="190" y="295" font-family="sans-serif" font-size="10" fill="white">Lakers</text>
  <rect x="350" y="285" width="80" height="8" rx="4" fill="#1f2937"/><rect x="350" y="285" width="55" height="8" rx="4" fill="#22c55e"/>
  <text x="355" y="293" font-family="sans-serif" font-size="8" fill="white">68%</text>
  <rect x="470" y="282" width="60" height="20" rx="4" fill="#059669" opacity="0.8"/><text x="500" y="296" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle">WIN</text>
  <text x="190" y="315" font-family="sans-serif" font-size="10" fill="white">Celtics</text>
  <rect x="350" y="305" width="80" height="8" rx="4" fill="#1f2937"/><rect x="350" y="305" width="45" height="8" rx="4" fill="#ef4444"/>
  <text x="355" y="313" font-family="sans-serif" font-size="8" fill="white">56%</text>
  <rect x="470" y="302" width="60" height="20" rx="4" fill="#ef4444" opacity="0.8"/><text x="500" y="316" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle">LOSS</text>
  <text x="190" y="335" font-family="sans-serif" font-size="10" fill="white">Warriors</text>
  <rect x="350" y="325" width="80" height="8" rx="4" fill="#1f2937"/><rect x="350" y="325" width="60" height="8" rx="4" fill="#22c55e"/>
  <text x="355" y="333" font-family="sans-serif" font-size="8" fill="white">72%</text>
  <rect x="470" y="322" width="60" height="20" rx="4" fill="#059669" opacity="0.8"/><text x="500" y="336" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle">WIN</text>
  <text x="190" y="355" font-family="sans-serif" font-size="10" fill="white">Nets</text>
  <rect x="350" y="345" width="80" height="8" rx="4" fill="#1f2937"/><rect x="350" y="345" width="35" height="8" rx="4" fill="#ef4444"/>
  <text x="355" y="353" font-family="sans-serif" font-size="8" fill="white">43%</text>
  <rect x="470" y="342" width="60" height="20" rx="4" fill="#ef4444" opacity="0.8"/><text x="500" y="356" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle">LOSS</text>
  <!-- Title -->
  <text x="400" y="455" font-family="sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">NBA Prediction Model</text>
  <text x="400" y="480" font-family="sans-serif" font-size="14" fill="#fb923c" text-anchor="middle">Machine Learning Sports Analytics</text>
</svg>
